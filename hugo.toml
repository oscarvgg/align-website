baseURL = "https://align.day/"
title = "Align"
languageCode = "en"
defaultContentLanguage = "en"
contentDir = "Content"
staticDir = ["Resources"]
publishDir = "Output"
disableHugoGeneratorInject = true

taxonomies = { tag = "tags" }

[params]
description = "Align is a visual daily planner for iPhone that turns tasks and calendar events into a realistic time-blocked schedule you can adjust as life changes."

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.typographer]
disable = true

[markup.goldmark.parser]
# Headings need IDs so in-page anchors resolve. With this off, every
# fragment link on the site pointed at a target that did not exist.
autoHeadingID = true

[outputFormats.RSS]
baseName = "feed"
mediaType = "application/rss+xml"
isPlainText = true
noUgly = true
permalinkable = true
protocol = "https://"
rel = "alternate"
suffix = "rss"

[outputFormats.SITEMAP]
baseName = "sitemap"
isPlainText = true
mediaType = "application/xml"
noUgly = true
rel = "sitemap"
suffix = "xml"

[outputs]
home = ["HTML", "RSS", "SITEMAP"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]
page = ["HTML"]

[mediaTypes."application/rss+xml"]
suffixes = ["rss"]

[security.funcs]
getenv = ["^HUGO_", "^CI$", "^APP_STORE_PROVIDER_TOKEN$"]
